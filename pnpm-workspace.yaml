packages:
  - "apps/*"
  - "packages/*"

# One version of each shared runtime for every app and package, so each app bundles one React and
# one query client. React is pinned to the Expo SDK's version: React Native needs an exact match.
catalog:
  "@tanstack/query-async-storage-persister": ^5.103.1
  "@tanstack/query-core": ^5.104.1
  "@tanstack/query-persist-client-core": ^5.104.1
  "@tanstack/react-query": ^5.104.1
  "@types/react": ~19.2.18
  "@types/react-dom": ~19.2.7
  "@vitejs/plugin-react": ^5.2.0
  babel-plugin-react-compiler: ^1.0.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  typescript: 5.9.3
  vite: ^7.3.6
  zustand: ^5.0.15

allowBuilds:
  "electron@44.4.3": true
  "esbuild@0.25.12": true
  "esbuild@0.28.2": true

# electron-vite requires electron without declaring it; this links the desktop app's electron for it.
packageExtensions:
  "electron-vite@5":
    peerDependencies:
      electron: "*"
